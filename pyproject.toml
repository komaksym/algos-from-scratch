[project]
name = "algos-from-scratch"
version = "0.1.0"
description = "Algorithms and machine learning implementations from scratch."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.4",
    "torch>=2.11.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.15.1",
    "imbalanced-learn>=0.14.0",
    "pre-commit-hooks>=6.0.0",
    "prek>=0.3.13",
    "ruff>=0.14.0",
    "scikit-learn>=1.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = [
    ".ipynb_checkpoints",
    ".venv",
    "checkpoints",
    "data",
    "runs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools]
packages = []

[tool.commitizen]
name = "cz_conventional_commits"
